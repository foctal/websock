name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tests/worker-compat/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check browser crates
        run: >-
          cargo check --locked
          -p websock
          -p websock-mux
          -p websock-wasm
          -p websock-wasm-mux
          -p websock-wasm-demo
          --target wasm32-unknown-unknown

      - name: Check workers-rs dependency compatibility
        run: cargo check --manifest-path tests/worker-compat/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Install the locked WASM tools
        run: cargo install wasm-bindgen-cli --version "$(python3 scripts/test-browser.py --print-bindgen-version)" --locked
      - name: Run browser unit and integration tests
        run: python3 scripts/test-browser.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
      - name: Check supported Rust version
        run: |
          cargo +1.88.0 check --workspace --locked
          cargo +1.88.0 check --locked --target wasm32-unknown-unknown -p websock -p websock-mux -p websock-wasm -p websock-wasm-mux -p websock-wasm-demo
