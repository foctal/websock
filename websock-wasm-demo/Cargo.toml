[package]
name = "websock-wasm-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
websock = { path = "../websock" }
websock-mux = { path = "../websock-mux" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Document", "HtmlInputElement", "HtmlButtonElement", "Window"] }
futures-util = { version = "0.3", features = ["sink"] }
