[package]
name = "websock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "WebSocket library for native and WebAssembly"
repository = "https://github.com/foctal/websock"
readme = "../README.md"
keywords = ["network", "websocket", "native", "wasm"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[dependencies]
websock-proto = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
websock-tungstenite = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
websock-wasm = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "macros"] }
futures-util = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "std"] }
url = "2"

[[example]]
name = "echo-client"
path = "examples/echo-client.rs"

[[example]]
name = "echo-server"
path = "examples/echo-server.rs"

[[example]]
name = "split-client"
path = "examples/split-client.rs"
